<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - RSU REQS</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="/assets/css/style.css" rel="stylesheet" />

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
      (function(){
         // REPLACE WITH YOUR PUBLIC KEY from the Dashboard
         emailjs.init("T7baF7XJ6nZCGRnMi"); 
      })();
    </script>
  </head>
  <body>
    <div class="d-flex flex-grow-1 justify-content-center align-items-center margin-auto">
      <div class="login-card-custom">
        <div class="content">
          <h4 class="mt-3 mb-2 fw-bold">Forgot Your Password?</h4>
          <p class="text-muted">
            Enter your email below and we'll send you a link to reset it.
          </p>
          <form id="forgotForm">
            <div class="mb-3">
              <label for="email" class="form-label mb-2">Email</label>
              <input type="email" id="email" class="form-control" placeholder="Enter your registered email" required />
            </div>
            <div id="formAlert" class="alert d-none" role="alert"></div>
            <div class="hero-buttons">
              <button type="submit" id="submitBtn" class="btn btn-primary w-100 mt-2">
                Send Reset Link
              </button>
            </div>
            <p class="mt-3 text-center">
              Remembered your password? <a href="/login">Back to Login</a>
            </p>
          </form>
        </div>
      </div>
    </div>

    <script>
      document.getElementById("forgotForm").addEventListener("submit", async function (e) {
          e.preventDefault();

          const emailInput = document.getElementById("email").value;
          const formAlert = document.getElementById("formAlert");
          const submitBtn = document.getElementById("submitBtn");
          const originalBtnText = submitBtn.innerHTML;

          // UI Loading State
          submitBtn.disabled = true;
          submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Processing...';
          formAlert.classList.add("d-none");

          try {
            // 2. GET THE TOKEN FROM BACKEND
            const response = await fetch("/api/forgot-password", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email: emailInput }),
            });

            const result = await response.json();

            if (result.success) {
              // If email exists, the backend gave us the link. Now WE send the email.
              if (result.emailFound) {
                  const templateParams = {
                      to_email: emailInput,
                      to_name: result.user_name,
                      reset_link: result.reset_link // <--- The backend provided secure link
                  };

                  // 3. SEND EMAIL FROM BROWSER (Since we know this works for you)
                  await emailjs.send('service_0yj04gg', 'template_i87iden', templateParams);
              }
              
              // Show success message (even if email wasn't found, for security)
              formAlert.classList.remove("d-none", "alert-danger");
              formAlert.classList.add("alert-success");
              formAlert.textContent = "If an account exists, a reset link has been sent.";
              submitBtn.innerHTML = "Link Sent!";
            } else {
              throw new Error(result.message || "Failed to generate link.");
            }
          } catch (error) {
            console.error("Error:", error);
            formAlert.classList.remove("d-none", "alert-success");
            formAlert.classList.add("alert-danger");
            formAlert.textContent = "Error: " + (error.message || "Could not send email.");
            submitBtn.disabled = false;
            submitBtn.innerHTML = originalBtnText;
          }
      });
    </script>
  </body>
</html>
